<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/styles_index.css">
</head>
<body>

    <main class="login">

        <header class="cabecera">
            <img src="img/logo_azul.png" alt="Logo">
            <div class="logotipo">LingoLeon</div>
            <p>Aprende Inglés, Alemán y Chino gratis y de forma divertida</p>
        </header>

        <section class="formulario">
            <h1>Iniciar Sesión</h1>
            <form action="pantalla_principal.html" method="get">
                <div class="campo">
                    <label for="usuario">Usuario / Email</label>
                    <input type="text" id="usuario" required>
                </div>

                <div class="campo">
                    <label for="contrasenia">Contraseña</label>
                    <input type="password" id="contrasenia" required>
                </div>

                <button type="submit">Iniciar sesión</button>
            </form>

            <div class="enlaces">
                <a href="recuperacion.html">¿Olvidaste tu contraseña?</a>
                <a href="registro.html">Registrarse</a>
            </div>
        </section>

    </main>

</body>
</html>
