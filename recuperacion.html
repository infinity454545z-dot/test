<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="css/styles_recuperacion.css">
</head>
<body>

    <main class="recuperar">

        <header class="cabecera">
            <img src="img/logo_azul.png" alt="Logo">
            <div class="logotipo">LingoLeon</div>
            <p>Aprende Inglés, Alemán y Chino gratis y de forma divertida</p>
        </header>

        <section class="formulario">
            <h2>¿Olvidaste tu contraseña?</h2>

            <p>Ingresá tu email para recuperar tu contraseña.</p>
            <form action="index.html" method="get">
                 <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required>
                </div>
                <button type="submit">Enviar recuperación</button>
            </form>

            <a class="volver" href="index.html">Volver al inicio</a>
        </section>

    </main>

</body>
</html>
