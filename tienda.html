<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda y Rachas</title>
    <link rel="stylesheet" href="css/styles_tienda.css">
</head>
<body>

    <main class="pagina">

        <header class="barra">
            <div class="logo">LingoLeon</div>

            <nav>
                <a href="pantalla_principal.html">Inicio</a>
                <a href="perfil.html">Perfil</a>
                <a href="ranking.html">Ranking</a>
                <a href="tienda.html">Tienda/Rachas</a>
            </nav>
        </header>

        <section class="contenido">

            <div class="racha">
                <h1>🔥 Tu Racha</h1>
                <div class="numero">5</div>
                <p>Días seguidos aprendiendo</p>
            </div>

            <div class="tienda">

                <h1>Tienda</h1>

                <div class="productos">

                    <article>
                        <div class="imagen">🛡️</div>
                        <h2>Protector de Racha</h2>
                        <p>Protege tu racha durante un día.</p>
                        <strong>200 XP</strong>
                        <button>Comprar</button>
                    </article>

                    <article>
                        <div class="imagen">🧪</div>
                        <h2>Bonus de XP</h2>
                        <p>Obtén experiencia extra.</p>
                        <strong>300 XP</strong>
                        <button>Comprar</button>
                    </article>

                    <article>
                        <div class="imagen">💝</div>
                        <h2>Corazón Extra</h2>
                        <p>Obtén una vida adicional.</p>
                        <strong>150 XP</strong>
                        <button>Comprar</button>
                    </article>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
